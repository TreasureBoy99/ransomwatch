<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
  <style>
    :root { --bg: #121212; --card: #151515; --fg: #e8eaed; --muted: #9aa1ab; --line: #2c3037; --accent: #861414; --accent2: #f70102; --err: #ff8787; }
    /*@media (prefers-color-scheme: dark) {*/
    /*  :root { --bg: #121212; --card: #151515; --fg: #e8eaed; --muted: #9aa1ab; --line: #2c3037; --accent: #861414; --accent2: #f70102; --err: #ff8787; }*/
    /*}*/
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 400px; padding: 28px 24px; text-align: center;
      background: var(--card); border: 1px solid var(--accent); box-shadow: 0 0 6px var(--accent2); border-radius: 14px; }
    .logo { display: block; margin: 0 auto 16px; max-width: 100%; max-height: 160px; width: auto; height: auto; }
    h1 { margin: 0 0 6px; font-size: 1.15rem; }
    p { margin: 0; color: var(--muted); }
    .status { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 24px; margin-top: 22px; font-size: .95rem; }
    .status[hidden], .spin[hidden], button[hidden] { display: none; }
    .spin { width: 18px; height: 18px; flex: none; border: 2px solid var(--line); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
    .err { color: var(--err); }
    button { margin-top: 16px; padding: 8px 16px; font: inherit; color: var(--fg); background: #1e1e1e;
      border: none; border-radius: 8px; cursor: pointer; transition: all .2s; }
    button:hover, button:focus-visible { filter: brightness(1.2); }
    noscript p { margin-top: 18px; color: var(--err); }
  </style>
  <title>Quick check</title>

  <div class="status" role="status" aria-live="polite" hidden><span class="spin" id="spin"></span><span id="msg"></span></div>
  <button id="retry" type="button" hidden>Try Again</button>
  <noscript><p>This check needs JavaScript. In Tor Browser, use the Standard or Safer security level.</p></noscript>
</main>
<script id="pow">
// ALTCHA-compatible proof of work (SHA-256): find n where SHA-256(salt + n) === challenge.
// The CAPTCHA page inlines this file (with "export " removed) for both the page and its Web Workers.
// The exports let Node import it too, e.g. to test it. Keep it dependency-free, plain ES2015.

const K = new Uint32Array([
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
]);
const W = new Uint32Array(64);

// SHA-256 of an ASCII string, as lowercase hex.
function sha256hex(str) {
  const len = str.length;
  const blocks = (len + 72) >> 6; // ceil((len + 9) / 64)
  const m = new Uint32Array(blocks * 16);
  for (let i = 0; i < len; i++) m[i >> 2] |= (str.charCodeAt(i) & 0xff) << (24 - (i & 3) * 8);
  m[len >> 2] |= 0x80 << (24 - (len & 3) * 8);
  m[blocks * 16 - 1] = len * 8;

  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;

  for (let blk = 0; blk < blocks; blk++) {
    for (let t = 0; t < 16; t++) W[t] = m[blk * 16 + t];
    for (let t = 16; t < 64; t++) {
      const x = W[t - 15], y = W[t - 2];
      const s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
      const s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
      W[t] = (W[t - 16] + s0 + W[t - 7] + s1) | 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let t = 0; t < 64; t++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const t1 = (h + S1 + ((e & f) ^ (~e & g)) + K[t] + W[t]) | 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
    h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
  }
  let out = '';
  const hs = [h0, h1, h2, h3, h4, h5, h6, h7];
  for (let i = 0; i < 8; i++) out += ('0000000' + (hs[i] >>> 0).toString(16)).slice(-8);
  return out;
}

// Try start, start+step, ... up to end (inclusive). Returns the number, or -1.
function searchRange(salt, challenge, start, end, step) {
  for (let n = start; n <= end; n += step) {
    if (sha256hex(salt + n) === challenge) return n;
  }
  return -1;
}

</script>
<script>
(function () {
  'use strict';
  var POW = document.getElementById('pow').textContent;
  var box = document.querySelector('.status'), msg = document.getElementById('msg');
  var spin = document.getElementById('spin'), retry = document.getElementById('retry');
  box.hidden = false;

  function show(text, isError) { msg.textContent = text; msg.className = isError ? 'err' : ''; spin.hidden = !!isError; }
  function giveUp(text) { show(text, true); retry.hidden = false; }
  retry.onclick = function () { retry.hidden = true; run(); };

  function countdown(seconds, label) {
    return new Promise(function (resolve) {
      var left = Math.max(1, Math.ceil(Number(seconds) || 10));
      (function tick() {
        if (left <= 0) return resolve();
        show(label + ' ' + left + 's');
        left--;
        setTimeout(tick, 1000);
      })();
    });
  }

  // Search the number range in parallel Web Workers; fall back to the page itself.
  function solve(c) {
    return new Promise(function (resolve, reject) {
      var n = Math.max(1, Math.min(navigator.hardwareConcurrency || 2, 8));
      var workers = [], pending = n, settled = false, url = null;
      function stop() {
        workers.forEach(function (w) { w.terminate(); });
        if (url) URL.revokeObjectURL(url);
      }
      function finish(value) {
        if (settled) return;
        settled = true; stop();
        value >= 0 ? resolve(value) : reject(new Error('no solution'));
      }
      function inPage() {
        if (settled) return;
        stop(); workers = [];
        setTimeout(function () { finish(searchRange(c.salt, c.challenge, 0, c.maxnumber, 1)); }, 30);
      }
      try {
        url = URL.createObjectURL(new Blob([POW + '\nonmessage=function(e){var d=e.data;' +
          'postMessage(searchRange(d.salt,d.challenge,d.start,d.end,d.step));};'], { type: 'text/javascript' }));
        for (var i = 0; i < n; i++) workers.push(new Worker(url));
      } catch (e) { return inPage(); }
      workers.forEach(function (w, i) {
        w.onmessage = function (e) {
          if (e.data >= 0) finish(e.data);
          else if (--pending === 0) finish(-1);
        };
        w.onerror = inPage;
        w.postMessage({ salt: c.salt, challenge: c.challenge, start: i, end: c.maxnumber, step: n });
      });
    });
  }

  function run() {
    show('Preparing…');
    var c, started;
    fetch('/_gate/challenge', { cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 429) {
          return countdown(r.headers.get('Retry-After'), 'Too many attempts. Retrying in').then(function () { throw 'again'; });
        }
        if (!r.ok) throw new Error('challenge ' + r.status);
        return r.json();
      })
      .then(function (challenge) {
        c = challenge; started = Date.now();
        show('Checking your browser…');
        return solve(c);
      })
      .then(function (number) {
        var payload = btoa(JSON.stringify({ algorithm: c.algorithm, challenge: c.challenge, number: number,
          salt: c.salt, signature: c.signature, took: Date.now() - started }));
        return fetch('/_gate/verify', { method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ payload: payload }) });
      })
      .then(function (r) {
        if (r.ok) { show('Done. Loading…'); location.reload(); return; }
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (d.error === 'cooldown') return countdown(d.retry_after, 'Too many requests. You can continue in').then(run);
          if (d.error === 'busy') return countdown(d.retry_after, 'The service is busy. Retrying in').then(run);
          if (d.error === 'expired' || d.error === 'replay') return run();
          giveUp('Verification failed.');
        });
      })
      .catch(function (e) {
        if (e === 'again') return run();
        giveUp('Something went wrong. Check your connection and try again.');
      });
  }
  run();
})();
</script>
</body>
